<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drone Hunter invite</title>
<meta property="og:title" content="Duel me in Drone Hunter!">
<meta property="og:description" content="Tap to add me as a friend and challenge me to a 1v1.">
<style>
  :root { --bg: #0f1114; --panel: #1b1e23; --text: #eef0f2; --muted: #9ea5ad; --accent: #fa9429; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: var(--bg); color: var(--text); font: 16px/1.45 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; padding: 16px; }
  main { width: 100%; max-width: 420px; background: var(--panel); border-radius: 16px; padding: 28px 22px; text-align: center; }
  h1 { margin: 0 0 6px; font-size: 26px; letter-spacing: 0.04em; }
  p { margin: 0 0 18px; color: var(--muted); }
  .code { font: 700 34px/1 ui-monospace, Menlo, monospace; color: var(--accent); letter-spacing: 0.12em; margin: 8px 0 22px; }
  a.btn, button { display: block; width: 100%; padding: 15px; margin: 10px 0 0; border: 0; border-radius: 12px;
         font: 600 17px/1 inherit; text-decoration: none; cursor: pointer; }
  .primary { background: var(--accent); color: #1a1205; }
  .secondary { background: #2a2e35; color: var(--text); }
  small { display: block; margin-top: 16px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>DRONE HUNTER</h1>
  <p id="lead">A friend invited you to a 1v1 duel.</p>
  <div class="code" id="code">······</div>
  <a class="btn primary" id="open" href="#">Open in the game</a>
  <a class="btn secondary" id="store" href="#">Get the game</a>
  <button class="secondary" id="copy">Copy friend code</button>
  <small id="hint">No app yet? Copy the code, install the game, then open Friends and tap Paste.</small>
</main>
<script>
  // Store links: fill in once the game is live (the in-game invite only carries ?c=CODE).
  var APP_STORE_URL = "https://apps.apple.com/app/id6832549412";
  var PLAY_STORE_URL = "";
  var params = new URLSearchParams(location.search);
  var code = (params.get("c") || "").toUpperCase().replace(/[^A-HJ-NP-Z2-9]/g, "").slice(0, 6);
  var deep = "dronehunter://friend/" + code;
  var ua = navigator.userAgent;
  var android = /Android/i.test(ua);
  var store = android ? PLAY_STORE_URL : APP_STORE_URL;
  document.getElementById("code").textContent = code.length === 6 ? code.slice(0, 3) + " " + code.slice(3) : "------";
  document.getElementById("open").href = deep;
  var storeBtn = document.getElementById("store");
  if (store) { storeBtn.href = store; } else { storeBtn.style.display = "none"; }
  document.getElementById("copy").onclick = function () {
    var btn = this;
    (navigator.clipboard ? navigator.clipboard.writeText(code) : Promise.reject()).then(function () {
      btn.textContent = "Copied!";
    }, function () { btn.textContent = code; });
  };
  // Try the app straight away; the buttons stay for when it is not installed.
  if (code.length === 6) { setTimeout(function () { location.href = deep; }, 300); }
</script>
</body>
</html>
